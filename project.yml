name: DrawMoar
options:
  deploymentTarget:
    iOS: '26.0'
packages:
  CompanionKit:
    path: CompanionKit
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: 0.18.2
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: 1.1.1
targets:
  DrawMoar:
    type: application
    platform: iOS
    sources:
      - path: DrawMoar
        excludes: [Assets.xcassets, Info.plist]
      - path: DrawMoar/Assets.xcassets
        buildPhase: resources
    info:
      path: .build/DrawMoar-Info.plist
      properties:
        CFBundleShortVersionString: 1.3.0
        DrawMoarAppGroup: group.${DRAWMOAR_BUNDLE_ID}
        NSLocalNetworkUsageDescription: Connect to ClipMoar on your Mac.
        NSMicrophoneUsageDescription: Record your voice for notes and dictation.
        NSSpeechRecognitionUsageDescription: Transcribe your voice notes with Apple Speech.
        NSCameraUsageDescription: Scan the pairing code shown on your Mac.
        CFBundleURLTypes:
          - CFBundleURLSchemes: [drawmoar]
        NSBonjourServices: ["_clipmoar._tcp"]
        UILaunchScreen: {}
    entitlements:
      path: .build/DrawMoar.entitlements
      properties:
        com.apple.security.application-groups: ["group.${DRAWMOAR_BUNDLE_ID}"]
    dependencies:
      - package: CompanionKit
      - package: FluidAudio
      - package: WhisperKit
      - target: DrawMoarShare
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: ${DRAWMOAR_BUNDLE_ID}
        DEVELOPMENT_TEAM: ${DRAWMOAR_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: '1,2'
  DrawMoarShare:
    type: app-extension
    platform: iOS
    sources: [DrawMoarShare]
    info:
      path: .build/DrawMoarShare-Info.plist
      properties:
        CFBundleDisplayName: DrawMoar
        CFBundleShortVersionString: 1.3.0
        DrawMoarAppGroup: group.${DRAWMOAR_BUNDLE_ID}
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: .build/DrawMoarShare.entitlements
      properties:
        com.apple.security.application-groups: ["group.${DRAWMOAR_BUNDLE_ID}"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${DRAWMOAR_BUNDLE_ID}.Share
        DEVELOPMENT_TEAM: ${DRAWMOAR_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: '1,2'
  DrawMoarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DrawMoarTests]
    dependencies:
      - target: DrawMoar
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ${DRAWMOAR_BUNDLE_ID}.Tests
        DEVELOPMENT_TEAM: ${DRAWMOAR_TEAM_ID}
        CODE_SIGN_STYLE: Automatic
schemes:
  DrawMoar:
    build:
      targets:
        DrawMoar: all
        DrawMoarTests: [test]
    test:
      targets: [DrawMoarTests]
